<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Atualizador Mercado Livre</title>
    <!-- Bootstrap para deixar o visual limpo e moderno -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f8fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .btn-meli {
            background-color: #ffe600;
            color: #2d327d;
            font-weight: bold;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .btn-meli:hover {
            background-color: #f3dc00;
            color: #1e2152;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h3 class="mb-3 text-dark">Painel Mercado Livre</h3>
        <p class="text-muted mb-4">Faça login com sua conta do Mercado Livre para gerenciar seus preços em massa.</p>
        
        <button class="btn btn-meli" onclick="iniciarLoginMeli()">
            Entrar com o Mercado Livre
        </button>
        
        <div id="status-retorno" class="mt-3"></div>
    </div>

    <script>
        // Configurações da sua aplicação
        const CLIENT_ID = "8447530383468116";
        // Substitua pelo seu link exato do GitHub Pages quando estiver publicado (ex: https://seu-usuario.github.io/Site-Atualizar-pre-o-ml/)
        const REDIRECT_URI = window.location.origin + window.location.pathname; 
        const CODE_VERIFIER = "meu_codigo_verificador_seguro_1234567890_pkce";

        // Função para gerar o Code Challenge em SHA-256 para o PKCE no navegador
        async function gerarCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            
            // Base64Url encode
            let base64 = btoa(String.fromCharCode(...new Uint8Array(digest)));
            return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function iniciarLoginMeli() {
            const codeChallenge = await gerarCodeChallenge(CODE_VERIFIER);
            
            // Monta a URL de autorização oficial do Mercado Livre
            const authUrl = `https://auth.mercadolibre.com/authorization?response_type=code&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&code_challenge=${codeChallenge}&code_challenge_method=S256`;
            
            // Redireciona o usuário para o login do Meli
            window.location.href = authUrl;
        }

        // Ao carregar a página, verifica se o Mercado Livre redirecionou de volta com o "code"
        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                document.getElementById('status-retorno').innerHTML = `
                    <div class="alert alert-success py-2">
                        <strong>Login autorizado!</strong><br>Código obtido com sucesso. Preparando token...
                    </div>
                `;
                console.log("Authorization Code recebido:", code);
                // Aqui no próximo passo vamos trocar esse "code" pelo Access Token via API do Meli.
            }
        };
    </script>

</body>
</html>
