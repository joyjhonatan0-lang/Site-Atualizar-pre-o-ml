<script>

const RENDER_URL =
    "https://site-atualizar-pre-o-ml.onrender.com";

let anuncios = [];
let anunciosFiltrados = [];
let usuarioLogado = false;

let accessToken =
    sessionStorage.getItem("ml_access_token") || "";


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function mostrarPagina(id) {

    document.querySelectorAll(
        "#pagina-inicial, #pagina-login, #pagina-dashboard"
    ).forEach(el => {
        el.classList.add("hidden-page");
    });

    document.getElementById(id)
        .classList.remove("hidden-page");
}


function abrirLogin() {

    mostrarPagina("pagina-login");

    carregarConfiguracaoLocal();
}


function voltarInicio() {

    mostrarPagina("pagina-inicial");
}


function mostrarInformacoes() {

    alert(
        "ML Hub Pro\n\n" +
        "Sistema de gestão para anúncios do Mercado Livre.\n\n" +
        "Você poderá consultar anúncios, simular custos, sincronizar preços e fretes e atualizar preços em massa."
    );
}


/* =========================================================
   CONFIGURAÇÃO LOCAL
========================================================= */

function carregarConfiguracaoLocal() {

    const clientId =
        localStorage.getItem("ml_client_id");

    const redirectUri =
        localStorage.getItem("ml_redirect_uri");


    if (clientId) {

        document.getElementById("client-id")
            .value = clientId;
    }


    if (redirectUri) {

        document.getElementById("redirect-uri")
            .value = redirectUri;
    }


    /*
     * Se já houver token na sessão, preenche o campo.
     */

    if (accessToken) {

        document.getElementById("access-token")
            .value = accessToken;
    }
}


/* =========================================================
   FUNÇÃO DE FETCH JSON
========================================================= */

async function fetchJson(url, options = {}) {

    const resposta =
        await fetch(url, options);


    const texto =
        await resposta.text();


    let dados = {};


    try {

        dados =
            texto
                ? JSON.parse(texto)
                : {};

    } catch (erro) {

        throw new Error(
            "O servidor retornou uma resposta inválida. " +
            "Verifique se o Render está online e se a URL do backend está correta."
        );
    }


    return {
        resposta,
        dados
    };
}


/* =========================================================
   HEADERS AUTENTICADOS
========================================================= */

function headersAutenticados(extra = {}) {

    const headers = {
        ...extra
    };


    if (accessToken) {

        headers.Authorization =
            "Bearer " + accessToken;
    }


    return headers;
}


/* =========================================================
   LOGIN MANUAL
========================================================= */

async function iniciarOAuth(event) {

    event.preventDefault();


    const clientId =
        document.getElementById("client-id")
            .value
            .trim();


    const clientSecret =
        document.getElementById("client-secret")
            .value
            .trim();


    const redirectUri =
        document.getElementById("redirect-uri")
            .value
            .trim();


    const tokenDigitado =
        document.getElementById("access-token")
            .value
            .trim();


    const erro =
        document.getElementById("erro-login");


    const botao =
        document.getElementById("btn-conectar");


    erro.classList.add("hidden");
    erro.textContent = "";


    /*
     * Para conexão manual, o Access Token é obrigatório.
     *
     * Client ID, Client Secret e Redirect URI ficam disponíveis
     * no formulário para manter sua configuração atual,
     * mas não são necessários para validar um token já emitido.
     */

    if (!tokenDigitado) {

        erro.textContent =
            "Cole um Access Token válido para conectar a conta.";

        erro.classList.remove("hidden");

        return;
    }


    if (clientId) {

        localStorage.setItem(
            "ml_client_id",
            clientId
        );
    }


    if (redirectUri) {

        localStorage.setItem(
            "ml_redirect_uri",
            redirectUri
        );
    }


    botao.disabled = true;

    botao.textContent =
        "Validando Access Token...";


    try {

        /*
         * O token fica somente durante a sessão do navegador.
         */

        accessToken =
            tokenDigitado;


        const resultado =
            await fetchJson(
                RENDER_URL +
                "/api/auth/start",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        client_id:
                            clientId,

                        client_secret:
                            clientSecret,

                        redirect_uri:
                            redirectUri,

                        access_token:
                            accessToken
                    })
                }
            );


        if (!resultado.resposta.ok) {

            throw new Error(
                resultado.dados.erro ||
                "Access Token inválido."
            );
        }


        if (!resultado.dados.sucesso) {

            throw new Error(
                resultado.dados.erro ||
                "Não foi possível conectar a conta."
            );
        }


        /*
         * Salva somente o Access Token na sessão.
         * Client Secret NÃO é salvo.
         */

        sessionStorage.setItem(
            "ml_access_token",
            accessToken
        );


        usuarioLogado = true;


        mostrarPagina(
            "pagina-dashboard"
        );


        await carregarDados();


    } catch (erroInterno) {

        accessToken = "";

        sessionStorage.removeItem(
            "ml_access_token"
        );


        erro.textContent =
            erroInterno.message ||
            "Erro ao conectar ao Mercado Livre.";


        erro.classList.remove("hidden");


    } finally {

        botao.disabled = false;

        botao.textContent =
            "Conectar ao Mercado Livre";
    }
}


/* =========================================================
   VERIFICAR LOGIN
========================================================= */

async function verificarLogin() {

    if (!accessToken) {

        mostrarPagina("pagina-inicial");

        return;
    }


    try {

        const resultado =
            await fetchJson(
                RENDER_URL +
                "/api/auth/status",
                {
                    headers:
                        headersAutenticados()
                }
            );


        if (
            resultado.resposta.ok &&
            resultado.dados.autenticado
        ) {

            usuarioLogado = true;

            mostrarPagina(
                "pagina-dashboard"
            );

            await carregarDados();

            return;
        }


        accessToken = "";

        sessionStorage.removeItem(
            "ml_access_token"
        );


        mostrarPagina(
            "pagina-inicial"
        );


    } catch (erro) {

        console.error(
            "Erro verificando autenticação:",
            erro
        );
    }
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    try {

        await fetch(
            RENDER_URL +
            "/api/auth/logout",
            {
                method: "POST",

                headers:
                    headersAutenticados()
            }
        );

    } catch (erro) {

        console.error(erro);
    }


    accessToken = "";

    sessionStorage.removeItem(
        "ml_access_token"
    );


    usuarioLogado = false;

    anuncios = [];

    anunciosFiltrados = [];


    mostrarPagina(
        "pagina-inicial"
    );
}


/* =========================================================
   CARREGAR DADOS
========================================================= */

async function carregarDados() {

    if (!accessToken) {

        mostrarPagina("pagina-login");

        return;
    }


    mostrarLoading(
        "Carregando anúncios..."
    );


    try {

        const resultado =
            await fetchJson(
                RENDER_URL +
                "/api/anuncios",
                {
                    headers:
                        headersAutenticados()
                }
            );


        const resposta =
            resultado.resposta;

        const dados =
            resultado.dados;


        if (resposta.status === 401) {

            accessToken = "";

            sessionStorage.removeItem(
                "ml_access_token"
            );


            esconderLoading();

            mostrarPagina(
                "pagina-login"
            );


            alert(
                "O Access Token é inválido ou expirou. Informe um novo token."
            );

            return;
        }


        if (!resposta.ok) {

            throw new Error(
                dados.erro ||
                "Erro ao carregar anúncios."
            );
        }


        anuncios =
            Array.isArray(dados.itens)
                ? dados.itens
                : [];


        anunciosFiltrados =
            [...anuncios];


        renderizarTudo();


    } catch (erro) {

        console.error(erro);

        alert(
            erro.message ||
            "Erro ao carregar os anúncios."
        );


    } finally {

        esconderLoading();
    }
}


/* =========================================================
   BUSCA
========================================================= */

function executarBusca(event) {

    event.preventDefault();


    const busca =
        document.getElementById("campo-busca")
            .value
            .trim()
            .toLowerCase();


    if (!busca) {

        anunciosFiltrados =
            [...anuncios];

    } else {

        anunciosFiltrados =
            anuncios.filter(item => {

                const titulo =
                    String(
                        item.titulo ||
                        item.title ||
                        ""
                    ).toLowerCase();


                const sku =
                    String(
                        item.sku || ""
                    ).toLowerCase();


                const id =
                    String(
                        item.id || ""
                    ).toLowerCase();


                return (
                    titulo.includes(busca) ||
                    sku.includes(busca) ||
                    id.includes(busca)
                );
            });
    }


    renderizarTudo();
}


/* =========================================================
   RENDERIZAÇÃO
========================================================= */

function renderizarTudo() {

    atualizarCards();

    renderizarTabelaAnuncios();

    renderizarTabelaSimulacao();

    renderizarTabelaAtualizacao();
}


function atualizarCards() {

    const total =
        anuncios.length;


    const ativos =
        anuncios.filter(
            item =>
                String(
                    item.status || ""
                ).toLowerCase() ===
                "active"
        ).length;


    const outros =
        total - ativos;


    document.getElementById(
        "card-total"
    ).textContent = total;


    document.getElementById(
        "card-ativos"
    ).textContent = ativos;


    document.getElementById(
        "card-outros"
    ).textContent = outros;


    document.getElementById(
        "contador-itens"
    ).textContent =
        anunciosFiltrados.length +
        " anúncio(s) exibido(s)";
}


function formatarMoeda(valor) {

    const numero =
        Number(valor);


    if (!Number.isFinite(numero)) {
        return "R$ 0,00";
    }


    return numero.toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );
}


/* =========================================================
   TABELA DE ANÚNCIOS
========================================================= */

function renderizarTabelaAnuncios() {

    const tbody =
        document.getElementById(
            "tabela-anuncios"
        );


    if (!anunciosFiltrados.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="8"
                    class="px-4 py-12 text-center text-slate-400">
                    Nenhum anúncio encontrado.
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML =
        anunciosFiltrados.map(item => {

            const titulo =
                item.titulo ||
                item.title ||
                "Sem título";


            const preco =
                item.preco ??
                item.price ??
                0;


            const comissao =
                item.comissao ??
                item.sale_fee ??
                0;


            const frete =
                item.frete ??
                item.shipping_cost ??
                0;


            const liquido =
                item.liquido ??
                item.net_received ??
                0;


            const status =
                String(
                    item.status || "—"
                );


            const statusNormalizado =
                status.toLowerCase();


            let statusClass =
                "bg-slate-100 text-slate-700";


            if (
                statusNormalizado ===
                "active"
            ) {

                statusClass =
                    "bg-green-100 text-green-700";

            } else if (
                statusNormalizado ===
                "paused"
            ) {

                statusClass =
                    "bg-yellow-100 text-yellow-700";

            } else if (
                statusNormalizado ===
                "closed"
            ) {

                statusClass =
                    "bg-red-100 text-red-700";
            }


            return `
                <tr class="border-b border-slate-100 hover:bg-slate-50">

                    <td class="px-4 py-4 font-mono text-xs">
                        ${item.id || "—"}
                    </td>

                    <td class="px-4 py-4">
                        <div class="font-bold text-slate-800">
                            ${titulo}
                        </div>
                    </td>

                    <td class="px-4 py-4 font-mono text-xs">
                        ${item.sku || "—"}
                    </td>

                    <td class="px-4 py-4">
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold ${statusClass}">
                            ${status}
                        </span>
                    </td>

                    <td class="px-4 py-4 text-right font-bold">
                        ${formatarMoeda(preco)}
                    </td>

                    <td class="px-4 py-4 text-right">
                        ${formatarMoeda(comissao)}
                    </td>

                    <td class="px-4 py-4 text-right">
                        ${formatarMoeda(frete)}
                    </td>

                    <td class="px-4 py-4 text-right font-black text-green-600">
                        ${formatarMoeda(liquido)}
                    </td>

                </tr>
            `;

        }).join("");
}


/* =========================================================
   SIMULAÇÃO
========================================================= */

function renderizarTabelaSimulacao() {

    const tbody =
        document.getElementById(
            "tabela-simulacao"
        );


    if (!anunciosFiltrados.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7"
                    class="px-4 py-12 text-center text-slate-400">
                    Nenhum anúncio carregado.
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML =
        anunciosFiltrados.map(
            (item, index) => {

                const preco =
                    Number(
                        item.preco ??
                        item.price
                    ) || 0;


                const novoPreco =
                    Number(
                        item.novoPreco
                    ) ||
                    preco;


                const comissao =
                    Number(
                        item.comissao ??
                        item.sale_fee
                    ) || 0;


                const frete =
                    Number(
                        item.frete ??
                        item.shipping_cost
                    ) || 0;


                return `
                    <tr class="border-b border-slate-100">

                        <td class="px-4 py-4">
                            <input
                                type="checkbox"
                                class="check-simulacao"
                                data-index="${index}">
                        </td>

                        <td class="px-4 py-4 font-bold">
                            ${item.titulo || item.title || "Sem título"}
                        </td>

                        <td class="px-4 py-4 text-right">
                            ${formatarMoeda(preco)}
                        </td>

                        <td class="px-4 py-4 text-right">

                            <input
                                type="number"
                                step="0.01"
                                value="${novoPreco.toFixed(2)}"
                                onchange="alterarNovoPreco(${index}, this.value)"
                                class="w-32 border border-slate-300 rounded-lg px-3 py-2 text-right">

                        </td>

                        <td class="px-4 py-4 text-right">
                            ${formatarMoeda(comissao)}
                        </td>

                        <td class="px-4 py-4 text-right">
                            ${formatarMoeda(frete)}
                        </td>

                        <td class="px-4 py-4 text-right font-black text-green-600">
                            ${formatarMoeda(calcularLiquido(item))}
                        </td>

                    </tr>
                `;

            }
        ).join("");
}


function alterarNovoPreco(index, valor) {

    const numero =
        Number(valor);


    anunciosFiltrados[index].novoPreco =
        Number.isFinite(numero)
            ? numero
            : (
                Number(
                    anunciosFiltrados[index].preco ??
                    anunciosFiltrados[index].price
                ) || 0
            );


    renderizarTabelaSimulacao();

    renderizarTabelaAtualizacao();
}


function calcularLiquido(item) {

    const preco =
        Number(
            item.novoPreco ??
            item.preco ??
            item.price
        ) || 0;


    const comissao =
        Number(
            item.comissao ??
            item.sale_fee
        ) || 0;


    const frete =
        Number(
            item.frete ??
            item.shipping_cost
        ) || 0;


    return preco -
        comissao -
        frete;
}


function calcularSimulacao() {

    const percentual =
        Number(
            document.getElementById(
                "sim-percentual"
            ).value
        ) || 0;


    const valor =
        Number(
            document.getElementById(
                "sim-valor"
            ).value
        );


    anunciosFiltrados.forEach(item => {

        let novoPreco =
            Number(
                item.preco ??
                item.price
            ) || 0;


        if (percentual !== 0) {

            novoPreco =
                novoPreco *
                (1 + percentual / 100);
        }


        if (Number.isFinite(valor)) {

            novoPreco += valor;
        }


        item.novoPreco =
            Math.max(0, novoPreco);
    });


    renderizarTabelaSimulacao();

    renderizarTabelaAtualizacao();
}


function selecionarTodosSimulacao(marcado) {

    document.querySelectorAll(
        ".check-simulacao"
    ).forEach(check => {

        check.checked = marcado;
    });
}


/* =========================================================
   ATUALIZAÇÃO
========================================================= */

function renderizarTabelaAtualizacao() {

    const tbody =
        document.getElementById(
            "tabela-atualizacao"
        );


    if (!anunciosFiltrados.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="5"
                    class="px-4 py-12 text-center text-slate-400">
                    Nenhum anúncio carregado.
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML =
        anunciosFiltrados.map(
            (item, index) => {

                const precoAtual =
                    Number(
                        item.preco ??
                        item.price
                    ) || 0;


                const novoPreco =
                    Number(
                        item.novoPreco
                    ) ||
                    precoAtual;


                return `
                    <tr class="border-b border-slate-100">

                        <td class="px-4 py-4">

                            <input
                                type="checkbox"
                                class="check-atualizacao"
                                data-index="${index}">

                        </td>

                        <td class="px-4 py-4 font-bold">
                            ${item.titulo || item.title || "Sem título"}
                        </td>

                        <td class="px-4 py-4 text-right">
                            ${formatarMoeda(precoAtual)}
                        </td>

                        <td class="px-4 py-4 text-right font-black">
                            ${formatarMoeda(novoPreco)}
                        </td>

                        <td class="px-4 py-4">
                            <span class="text-xs font-bold text-slate-500">
                                Aguardando
                            </span>
                        </td>

                    </tr>
                `;

            }
        ).join("");
}


function selecionarTodosAtualizacao(marcado) {

    document.querySelectorAll(
        ".check-atualizacao"
    ).forEach(check => {

        check.checked = marcado;
    });
}


async function aplicarAtualizacaoEmMassa() {

    const selecionados = [];


    document.querySelectorAll(
        ".check-atualizacao:checked"
    ).forEach(check => {

        const index =
            Number(
                check.dataset.index
            );


        const item =
            anunciosFiltrados[index];


        if (!item) {
            return;
        }


        const novoPreco =
            Number(
                item.novoPreco
            );


        if (
            !Number.isFinite(novoPreco) ||
            novoPreco <= 0
        ) {
            return;
        }


        selecionados.push({

            id:
                item.id,

            preco:
                novoPreco
        });
    });


    if (!selecionados.length) {

        alert(
            "Selecione pelo menos um anúncio com preço válido."
        );

        return;
    }


    if (
        !confirm(
            "Deseja realmente atualizar " +
            selecionados.length +
            " anúncio(s)?"
        )
    ) {
        return;
    }


    mostrarLoading(
        "Atualizando preços..."
    );


    try {

        const resultado =
            await fetchJson(
                RENDER_URL +
                "/api/atualizar-precos",
                {
                    method: "POST",

                    headers:
                        headersAutenticados({
                            "Content-Type":
                                "application/json"
                        }),

                    body: JSON.stringify({
                        itens:
                            selecionados
                    })
                }
            );


        if (!resultado.resposta.ok) {

            throw new Error(
                resultado.dados.erro ||
                "Erro ao atualizar preços."
            );
        }


        const resultados =
            Array.isArray(
                resultado.dados.resultados
            )
                ? resultado.dados.resultados
                : [];


        let sucesso = 0;
        let falhas = 0;


        resultados.forEach(resultadoItem => {

            if (resultadoItem.sucesso) {

                sucesso++;

            } else {

                falhas++;
            }
        });


        alert(
            "Atualização concluída.\n\n" +
            "Sucesso: " +
            sucesso +
            "\nFalhas: " +
            falhas
        );


        await carregarDados();

        trocarAba("gestao");


    } catch (erro) {

        alert(
            erro.message ||
            "Erro ao atualizar preços."
        );

    } finally {

        esconderLoading();
    }
}


/* =========================================================
   SINCRONIZAR PREÇOS
========================================================= */

async function sincronizarPrecosApi() {

    if (!anuncios.length) {

        alert(
            "Carregue os anúncios primeiro."
        );

        return;
    }


    mostrarLoading(
        "Sincronizando preços..."
    );


    try {

        const ids =
            anuncios.map(
                item => item.id
            );


        const resultado =
            await fetchJson(
                RENDER_URL +
                "/api/sincronizar-precos",
                {
                    method: "POST",

                    headers:
                        headersAutenticados({
                            "Content-Type":
                                "application/json"
                        }),

                    body: JSON.stringify({
                        ids
                    })
                }
            );


        if (!resultado.resposta.ok) {

            throw new Error(
                resultado.dados.erro ||
                "Erro ao sincronizar preços."
            );
        }


        const precos =
            resultado.dados.precos ||
            {};


        anuncios.forEach(item => {

            if (
                Object.prototype.hasOwnProperty.call(
                    precos,
                    item.id
                )
            ) {

                item.preco =
                    Number(
                        precos[item.id]
                    );

                item.price =
                    item.preco;
            }
        });


        anunciosFiltrados =
            [...anuncios];


        renderizarTudo();


        alert(
            "Preços sincronizados com sucesso."
        );


    } catch (erro) {

        alert(
            erro.message ||
            "Erro na sincronização."
        );

    } finally {

        esconderLoading();
    }
}


/* =========================================================
   SINCRONIZAR FRETES
========================================================= */

async function sincronizarFretesApi() {

    if (!anuncios.length) {

        alert(
            "Carregue os anúncios primeiro."
        );

        return;
    }


    mostrarLoading(
        "Sincronizando fretes..."
    );


    try {

        const ids =
            anuncios.map(
                item => item.id
            );


        const resultado =
            await fetchJson(
                RENDER_URL +
                "/api/sincronizar-fretes",
                {
                    method: "POST",

                    headers:
                        headersAutenticados({
                            "Content-Type":
                                "application/json"
                        }),

                    body: JSON.stringify({
                        ids
                    })
                }
            );


        if (!resultado.resposta.ok) {

            throw new Error(
                resultado.dados.erro ||
                "Erro ao sincronizar fretes."
            );
        }


        const fretes =
            resultado.dados.fretes ||
            {};


        anuncios.forEach(item => {

            const frete =
                fretes[item.id];


            if (!frete) {
                return;
            }


            const custo =
                Number(
                    frete.shipping_cost ??
                    frete.custo
                );


            if (Number.isFinite(custo)) {

                item.frete =
                    custo;

                item.shipping_cost =
                    custo;
            }
        });


        anunciosFiltrados =
            [...anuncios];


        renderizarTudo();


        alert(
            "Fretes sincronizados com sucesso."
        );


    } catch (erro) {

        alert(
            erro.message ||
            "Erro na sincronização."
        );

    } finally {

        esconderLoading();
    }
}


/* =========================================================
   ABAS
========================================================= */

function trocarAba(aba) {

    const abas = [
        "gestao",
        "simulacao",
        "atualizacao"
    ];


    abas.forEach(nome => {

        const secao =
            document.getElementById(
                "aba-" + nome
            );


        const botao =
            document.getElementById(
                "tab-" + nome
            );


        if (nome === aba) {

            secao.classList.remove(
                "hidden"
            );

            botao.classList.add(
                "tab-active"
            );

        } else {

            secao.classList.add(
                "hidden"
            );

            botao.classList.remove(
                "tab-active"
            );
        }
    });


    if (aba === "simulacao") {

        renderizarTabelaSimulacao();
    }


    if (aba === "atualizacao") {

        renderizarTabelaAtualizacao();
    }
}


/* =========================================================
   LOADING
========================================================= */

function mostrarLoading(texto) {

    document.getElementById(
        "loading-text"
    ).textContent = texto;


    document.getElementById(
        "loading"
    ).classList.remove(
        "hidden"
    );
}


function esconderLoading() {

    document.getElementById(
        "loading"
    ).classList.add(
        "hidden"
    );
}


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

async function abrirConfiguracao() {

    const modal =
        document.getElementById(
            "modal-config"
        );


    const status =
        document.getElementById(
            "status-config"
        );


    status.innerHTML = `
        <div class="flex items-center justify-center py-5">
            <div class="loading-spinner"></div>
        </div>
    `;


    modal.classList.remove(
        "hidden"
    );


    try {

        const resultado =
            await fetchJson(
                RENDER_URL +
                "/api/auth/status",
                {
                    headers:
                        headersAutenticados()
                }
            );


        const dados =
            resultado.dados;


        if (dados.autenticado) {

            status.innerHTML = `
                <div class="bg-green-50 border border-green-200 rounded-xl p-4">

                    <div class="font-black text-green-700">
                        ✓ Mercado Livre conectado
                    </div>

                    <div class="text-sm text-green-600 mt-1">
                        Usuário: ${dados.user_id || "Conectado"}
                    </div>

                    <div class="text-xs text-green-600 mt-2">
                        Access Token validado com sucesso.
                    </div>

                </div>
            `;

        } else {

            status.innerHTML = `
                <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-4">

                    <div class="font-black text-yellow-700">
                        Conta não conectada
                    </div>

                    <div class="text-sm text-yellow-600 mt-1">
                        Informe um Access Token válido.
                    </div>

                </div>
            `;
        }


    } catch (erro) {

        status.innerHTML = `
            <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-red-700">
                Não foi possível consultar o status da conexão.
            </div>
        `;
    }
}


function fecharConfiguracao() {

    document.getElementById(
        "modal-config"
    ).classList.add(
        "hidden"
    );
}


async function desconectarConta() {

    if (
        !confirm(
            "Deseja realmente desconectar a conta?"
        )
    ) {
        return;
    }


    await logout();

    fecharConfiguracao();
}

window.addEventListener(

    function() {

        verificarLogin();

    }
);
