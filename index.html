<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizador de Preços - Mercado Livre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .card-custom { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: white; padding: 30px; }
        .btn-meli { background-color: #ffe600; color: #2d327d; font-weight: bold; border: none; width: 100%; padding: 12px; border-radius: 6px; }
        .btn-meli:hover { background-color: #f3dc00; }
    </style>
</head>
<body>

    <div class="container" style="max-width: 700px;">
        <div class="card-custom">
            <h3 class="mb-3 text-center">Atualizador em Massa - Mercado Livre</h3>
            
            <!-- ETAPA 1: LOGIN -->
            <div id="secao-login" style="display: none;">
                <p class="text-muted text-center mb-4">Conecte-se com a sua conta do Mercado Livre para gerenciar os seus anúncios.</p>
                <button class="btn btn-meli" onclick="iniciarLoginMeli()">Entrar com o Mercado Livre</button>
            </div>

            <!-- ETAPA 2: PAINEL DE ATUALIZAÇÃO -->
            <div id="secao-painel" style="display: none;">
                <div class="alert alert-success py-2 text-center">Conta conectada com sucesso!</div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Cole os dados (ID do Anúncio e Novo Preço, separados por vírgula ou tabulação):</label>
                    <textarea id="listaProdutos" class="form-control" rows="6" placeholder="MLB7621024462, 28.50&#10;MLB7621024448, 31.00"></textarea>
                </div>
                
                <button class="btn btn-primary w-100" onclick="atualizarPrecos()">Iniciar Atualização de Preços</button>
                <div id="status-processo" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = "8447530383468116";
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const CODE_VERIFIER = "meu_codigo_verificador_seguro_1234567890_pkce";

        async function gerarCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            let base64 = btoa(String.fromCharCode(...new Uint8Array(digest)));
            return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function iniciarLoginMeli() {
            const codeChallenge = await gerarCodeChallenge(CODE_VERIFIER);
            const authUrl = `https://auth.mercadolibre.com/authorization?response_type=code&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&code_challenge=${codeChallenge}&code_challenge_method=S256`;
            window.location.href = authUrl;
        }

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const tokenSalvo = localStorage.getItem('meli_access_token');

            if (tokenSalvo) {
                document.getElementById('secao-painel').style.display = 'block';
            } else if (code) {
                document.getElementById('secao-login').style.display = 'block';
                document.getElementById('secao-login').innerHTML = `<p class="text-center text-info">A autenticar com o Mercado Livre...</p>`;
                
                // Nota: A troca do code por token via browser costuma bloquear por CORS na API do Meli. 
                // Se preferir, podemos usar o seu token gerado anteriormente ou configurar um endpoint. 
                // Por segurança no front-end puro, vamos solicitar o token ou exibi-lo.
                document.getElementById('secao-login').innerHTML = `
                    <div class="alert alert-warning">
                        Código obtido com sucesso! Para evitar bloqueio de segurança do navegador (CORS) do Mercado Livre, insira o seu <b>Access Token</b> abaixo:
                    </div>
                    <input type="text" id="inputTokenManual" class="form-control mb-3" placeholder="Cole seu Access Token aqui">
                    <button class="btn btn-success w-100" onclick="salvarTokenManual()">Salvar Token e Entrar</button>
                `;
            } else {
                document.getElementById('secao-login').style.display = 'block';
            }
        };

        function salvarTokenManual() {
            const token = document.getElementById('inputTokenManual').value.trim();
            if(token) {
                localStorage.setItem('meli_access_token', token);
                location.href = REDIRECT_URI; // Recarrega limpo
            } else {
                alert("Insira um token válido.");
            }
        }

        async function atualizarPrecos() {
            const token = localStorage.getItem('meli_access_token');
            const texto = document.getElementById('listaProdutos').value.trim();
            const statusDiv = document.getElementById('status-processo');

            if (!texto) {
                alert("Insira pelo menos um produto.");
                return;
            }

            const linhas = texto.split('\n');
            statusDiv.innerHTML = `<div class="alert alert-info">A processar ${linhas.length} itens...</div>`;

            let sucessos = 0;
            let erros = 0;

            for (let i = 0; i < linhas.length; i++) {
                const partes = linhas[i].split(/[\t,]+/);
                if (partes.length < 2) continue;

                const mlb = partes[0].trim();
                const preco = parseFloat(partes[1].trim().replace(',', '.'));

                try {
                    const resposta = await fetch(`https://api.mercadolibre.com/items/${mlb}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ price: preco })
                    });

                    if (resposta.ok) {
                        sucessos++;
                    } else {
                        erros++;
                    }
                } catch (e) {
                    erros++;
                }

                // Pausa de 1.5 segundos para evitar Erro 429
                await new Promise(r => setTimeout(r, 1500));
            }

            statusDiv.innerHTML = `<div class="alert alert-success">Processo concluído! Sucessos: ${sucessos} | Erros/Bloqueados: ${erros}</div>`;
        }
    </script>

</body>
</html>
