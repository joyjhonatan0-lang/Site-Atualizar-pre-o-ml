<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizador de Preços - Mercado Livre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 40px; }
        .card-custom { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: white; padding: 30px; }
        .btn-meli { background-color: #ffe600; color: #2d327d; font-weight: bold; border: none; width: 100%; padding: 12px; border-radius: 6px; }
        .btn-meli:hover { background-color: #f3dc00; }
    </style>
</head>
<body>

    <div class="container" style="max-width: 750px;">
        <div class="card-custom">
            <h3 class="mb-4 text-center">Painel de Preços - Mercado Livre</h3>
            
            <!-- ETAPA DE AUTENTICAÇÃO / TOKEN -->
            <div id="secao-token" class="mb-4 p-3 bg-light rounded border">
                <label class="form-label fw-bold">Access Token do Mercado Livre:</label>
                <div class="input-group">
                    <input type="text" id="inputToken" class="form-control" placeholder="Cole seu Access Token aqui (App_AccessToken...)">
                    <button class="btn btn-dark" onclick="salvarToken()">Salvar Token</button>
                </div>
                <small class="text-muted">O token fica salvo no seu navegador para uso contínuo.</small>
            </div>

            <!-- PAINEL DE ATUALIZAÇÃO EM MASSA -->
            <div id="secao-painel">
                <div class="mb-3">
                    <label class="form-label fw-bold">Lista de Produtos (ID do Anúncio e Novo Preço):</label>
                    <div class="form-text mb-2">Cole no formato: <code>MLB7621024462, 28.50</code> (um por linha)</div>
                    <textarea id="listaProdutos" class="form-control" rows="8" placeholder="MLB7621024462, 28.50&#10;MLB7621024448, 31.00"></textarea>
                </div>
                
                <button class="btn btn-primary w-100 py-2 fw-bold" onclick="atualizarPrecosEmLote()">Iniciar Atualização em Massa</button>
                <div id="status-processo" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script>
        // Ao carregar a página, preenche o token se já estiver salvo
        window.onload = function() {
            const tokenSalvo = localStorage.getItem('meli_access_token');
            if (tokenSalvo) {
                document.getElementById('inputToken').value = tokenSalvo;
            }
        };

        function salvarToken() {
            const token = document.getElementById('inputToken').value.trim();
            if (token) {
                localStorage.setItem('meli_access_token', token);
                alert("Token salvo com sucesso!");
            } else {
                alert("Por favor, insira um token válido.");
            }
        }

        async function atualizarPrecosEmLote() {
            const token = document.getElementById('inputToken').value.trim();
            const texto = document.getElementById('listaProdutos').value.trim();
            const statusDiv = document.getElementById('status-processo');

            if (!token) {
                alert("Insira o seu Access Token primeiro.");
                return;
            }

            if (!texto) {
                alert("Insira pelo menos um produto e preço.");
                return;
            }

            const linhas = texto.split('\n');
            statusDiv.innerHTML = `<div class="alert alert-info">A processar ${linhas.length} itens... Aguarde.</div>`;

            let sucessos = 0;
            let erros = 0;
            let htmlLog = "<ul class='list-group'>";

            for (let i = 0; i < linhas.length; i++) {
                const linhaAtual = linhas[i].trim();
                if (!linhaAtual) continue;

                // Separa por vírgula, ponto e vírgula ou tabulação
                const partes = linhaAtual.split(/[\t,;]+/);
                if (partes.length < 2) continue;

                const mlb = partes[0].trim();
                let precoStr = partes[1].trim().replace(',', '.');
                const preco = parseFloat(precoStr);

                if (isNaN(preco)) {
                    erros++;
                    htmlLog += `<li class='list-group-item list-group-item-danger'>${mlb}: Preço inválido</li>`;
                    continue;
                }

                try {
                    const resposta = await fetch(`https://api.mercadolibre.com/items/${mlb}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ price: preco })
                    });

                    if (resposta.ok) {
                        sucessos++;
                        htmlLog += `<li class='list-group-item list-group-item-success'>${mlb} -> Atualizado para R$ ${preco.toFixed(2)} (OK)</li>`;
                    } else {
                        const erroJson = await resposta.json();
                        let msgErro = erroJson.message || "Erro desconhecido";
                        if (erroJson.cause && erroJson.cause.length > 0 && erroJson.cause[0].message) {
                            msgErro = erroJson.cause[0].message;
                        }
                        erros++;
                        htmlLog += `<li class='list-group-item list-group-item-warning'>${mlb} -> ${msgErro}</li>`;
                    }
                } catch (e) {
                    erros++;
                    htmlLog += `<li class='list-group-item list-group-item-danger'>${mlb} -> Falha de conexão</li>`;
                }

                // Pausa de 1.5 segundos entre as requisições para evitar o Erro 429 (Rate Limit) do Mercado Livre
                await new Promise(resolve => setTimeout(resolve, 1500));
            }

            htmlLog += "</ul>";
            statusDiv.innerHTML = `
                <div class="alert alert-secondary mb-3"><strong>Processo Concluído!</strong> Sucessos: ${sucessos} | Erros/Bloqueados: ${erros}</div>
                ${htmlLog}
            `;
        }
    </script>

</body>
</html>
