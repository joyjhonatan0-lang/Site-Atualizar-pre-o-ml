<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Mercado Livre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; padding-top: 30px; }
        .card-custom { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: white; padding: 25px; margin-bottom: 20px; }
        .nav-pills .nav-link.active { background-color: #ffe600; color: #2d327d; font-weight: bold; }
        .nav-pills .nav-link { color: #495057; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container" style="max-width: 900px;">
        <h2 class="mb-4 text-center">Painel de Gestão - Mercado Livre</h2>

        <!-- MENU DE ABAS -->
        <ul class="nav nav-pills mb-3 justify-content-center" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-config-btn" data-bs-toggle="pill" data-bs-target="#tab-config" type="button">⚙️ Sincronização e Token</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-precos-btn" data-bs-toggle="pill" data-bs-target="#tab-precos" type="button">💰 Atualizar Preços</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-anuncios-btn" data-bs-toggle="pill" data-bs-target="#tab-anuncios" type="button" onclick="carregarMeusAnuncios()">📦 Puxar Anúncios</button>
            </li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
            
            <!-- ABA 1: SINCRONIZAÇÃO COM A PLANILHA -->
            <div class="tab-pane fade show active" id="tab-config" role="tabpanel">
                <div class="card-custom">
                    <h4 class="mb-3">Conexão Automática com a Planilha</h4>
                    <p class="text-muted">O site busca o token atualizado diretamente do seu Google Apps Script (Web App).</p>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">URL do Web App (Apps Script):</label>
                        <input type="text" id="inputUrlApi" class="form-control" placeholder="Cole aqui a URL terminada em /exec">
                    </div>
                    
                    <button class="btn btn-warning fw-bold w-100 mb-3" onclick="salvarUrlApi()">Salvar URL e Sincronizar Token</button>
                    <div id="status-config" class="mt-2"></div>
                </div>
            </div>

            <!-- ABA 2: ATUALIZAR PREÇOS -->
            <div class="tab-pane fade" id="tab-precos" role="tabpanel">
                <div class="card-custom">
                    <h4 class="mb-3">Atualização de Preços em Massa</h4>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Lista de Produtos (ID do Anúncio e Novo Preço):</label>
                        <div class="form-text mb-2">Formato: <code>MLB7621024462, 28.50</code> (um por linha)</div>
                        <textarea id="listaProdutos" class="form-control" rows="6" placeholder="MLB7621024462, 28.50"></textarea>
                    </div>
                    <button class="btn btn-primary w-100 fw-bold" onclick="atualizarPrecosEmLote()">Executar Atualização de Preços</button>
                    <div id="status-precos" class="mt-3"></div>
                </div>
            </div>

            <!-- ABA 3: PUXAR ANÚNCIOS -->
            <div class="tab-pane fade" id="tab-anuncios" role="tabpanel">
                <div class="card-custom">
                    <h4 class="mb-3">Seus Anúncios Ativos</h4>
                    <div id="lista-anuncios-resultado">
                        <div class="alert alert-info">A carregar anúncios...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.onload = function() {
            const urlSalva = localStorage.getItem('meli_webapp_url');
            if (urlSalva) {
                document.getElementById('inputUrlApi').value = urlSalva;
            }
        };

        function salvarUrlApi() {
            const url = document.getElementById('inputUrlApi').value.trim();
            if (url) {
                localStorage.setItem('meli_webapp_url', url);
                sincronizarTokenAutomatico(url);
            } else {
                alert("Insira uma URL válida.");
            }
        }

        async function sincronizarTokenAutomatico(url) {
            const statusDiv = document.getElementById('status-config');
            statusDiv.innerHTML = `<div class="alert alert-info">A sincronizar token...</div>`;
            try {
                const resposta = await fetch(url);
                const dados = await resposta.json();
                if (dados.access_token) {
                    localStorage.setItem('meli_access_token', dados.access_token);
                    statusDiv.innerHTML = `<div class="alert alert-success">Token sincronizado com sucesso!</div>`;
                } else {
                    statusDiv.innerHTML = `<div class="alert alert-danger">Erro ao obter o token.</div>`;
                }
            } catch (e) {
                statusDiv.innerHTML = `<div class="alert alert-danger">Erro de conexão com o Web App.</div>`;
            }
        }

        async function atualizarPrecosEmLote() {
            const token = localStorage.getItem('meli_access_token');
            const texto = document.getElementById('listaProdutos').value.trim();
            const statusDiv = document.getElementById('status-precos');

            if (!token) { alert("Sincronize o token na primeira aba."); return; }
            if (!texto) { alert("Insira os produtos."); return; }

            const linhas = texto.split('\n');
            statusDiv.innerHTML = `<div class="alert alert-info">A processar ${linhas.length} itens...</div>`;

            let sucessos = 0, erros = 0;
            let logHtml = "<ul class='list-group'>";

            for (let i = 0; i < linhas.length; i++) {
                const partes = linhas[i].split(/[\t,;]+/);
                if (partes.length < 2) continue;

                const mlb = partes[0].trim();
                const preco = parseFloat(partes[1].trim().replace(',', '.'));

                try {
                    const res = await fetch(`https://api.mercadolibre.com/items/${mlb}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ price: preco })
                    });

                    if (res.ok) {
                        sucessos++;
                        logHtml += `<li class='list-group-item list-group-item-success'>${mlb} -> Atualizado para R$ ${preco.toFixed(2)} (OK)</li>`;
                    } else {
                        erros++;
                        logHtml += `<li class='list-group-item list-group-item-warning'>${mlb} -> Erro ao atualizar</li>`;
                    }
                } catch(e) {
                    erros++;
                }
                await new Promise(r => setTimeout(r, 1500));
            }

            logHtml += "</ul>";
            statusDiv.innerHTML = `<div class="alert alert-secondary">Concluído! Sucessos: ${sucessos} | Erros: ${erros}</div>${logHtml}`;
        }

        async function carregarMeusAnuncios() {
            const url = localStorage.getItem('meli_webapp_url');
            const container = document.getElementById('lista-anuncios-resultado');

            if (!url) {
                container.innerHTML = `<div class="alert alert-danger">Configure a URL do Web App na aba de Sincronização primeiro.</div>`;
                return;
            }

            container.innerHTML = `<div class="alert alert-info">A consultar os seus anúncios através da planilha...</div>`;

            try {
                const resposta = await fetch(url + "?acao=anuncios");
                const dados = await resposta.json();

                if (dados.erro) {
                    container.innerHTML = `<div class="alert alert-danger">Erro: ${dados.erro}</div>`;
                    return;
                }

                const itens = dados.itens || [];
                if (itens.length === 0) {
                    container.innerHTML = `<div class="alert alert-warning">Nenhum anúncio encontrado.</div>`;
                    return;
                }

                let tabela = `<table class="table table-striped"><thead><tr><th>ID (MLB)</th><th>Título</th><th>Preço Atual</th></tr></thead><tbody>`;
                itens.forEach(item => {
                    tabela += `<tr><td>${item.id}</td><td>${item.title}</td><td>R$ ${item.price}</td></tr>`;
                });
                tabela += `</tbody></table>`;

                container.innerHTML = tabela;

            } catch (error) {
                container.innerHTML = `<div class="alert alert-danger">Erro de comunicação com o servidor.</div>`;
            }
        }
    </script>

</body>
</html>
