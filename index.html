<script>
    const RENDER_URL = "https://site-atualizar-pre-o-ml.onrender.com";

    let cacheItens = [];
    let novosPrecosCalculados = {};
    let abaAtualAtiva = 'gestao';


    /* =========================================================
       TOKEN
    ========================================================= */

    function obterTokenLocal() {
        return (
            localStorage.getItem('ml_access_token') ||
            ''
        ).trim();
    }


    function solicitarToken() {

        const aviso =
            document.getElementById('aviso-token');

        if (aviso) {
            aviso.classList.remove('hidden');
        }
    }


    function salvarTokenManual() {

        const input =
            document.getElementById(
                'input-token-manual'
            );

        const tokenVal =
            input
                ? input.value.trim()
                : '';


        if (!tokenVal) {

            alert(
                "Digite um Access Token válido."
            );

            return;
        }


        localStorage.setItem(
            'ml_access_token',
            tokenVal
        );


        if (input) {
            input.value = '';
        }


        const aviso =
            document.getElementById(
                'aviso-token'
            );

        if (aviso) {
            aviso.classList.add('hidden');
        }


        carregarDados();
    }


    /* =========================================================
       FETCH CENTRALIZADO
    ========================================================= */

    async function apiFetch(
        endpoint,
        options = {}
    ) {

        const token =
            obterTokenLocal();


        const headers =
            new Headers(
                options.headers || {}
            );


        if (token) {

            headers.set(
                'Authorization',
                'Bearer ' + token
            );
        }


        if (
            options.body &&
            typeof options.body === 'string' &&
            !headers.has('Content-Type')
        ) {

            headers.set(
                'Content-Type',
                'application/json'
            );
        }


        const response =
            await fetch(
                RENDER_URL + endpoint,
                {
                    ...options,
                    headers
                }
            );


        const texto =
            await response.text();


        let data = {};


        if (texto) {

            try {

                data =
                    JSON.parse(texto);

            } catch (e) {

                throw new Error(
                    `O servidor retornou uma resposta inválida (HTTP ${response.status}).`
                );
            }
        }


        return {
            response,
            data
        };
    }


    /* =========================================================
       BUSCA
    ========================================================= */

    function executarBusca() {

        const termo =
            document
                .getElementById('input-busca')
                .value
                .toLowerCase()
                .trim();


        let itensFiltrados =
            cacheItens;


        if (termo !== '') {

            itensFiltrados =
                cacheItens.filter(
                    item =>

                        String(
                            item.id
                        )
                            .toLowerCase()
                            .includes(termo)

                        ||

                        String(
                            item.sku
                        )
                            .toLowerCase()
                            .includes(termo)

                        ||

                        String(
                            item.title
                        )
                            .toLowerCase()
                            .includes(termo)
                );
        }


        if (
            abaAtualAtiva ===
            'gestao'
        ) {

            montarTabelaGestao(
                itensFiltrados
            );

        } else if (
            abaAtualAtiva ===
            'simulacao'
        ) {

            montarTabelaSimulacao(
                itensFiltrados
            );

        } else if (
            abaAtualAtiva ===
            'atualizacao'
        ) {

            montarTabelaAtualizacao(
                itensFiltrados
            );
        }
    }


    function limparBusca() {

        document
            .getElementById(
                'input-busca'
            )
            .value = '';

        executarBusca();
    }


    /* =========================================================
       CARREGAR ANÚNCIOS
    ========================================================= */

    async function carregarDados() {

        const token =
            obterTokenLocal();


        if (!token) {

            solicitarToken();

            return;
        }


        document.getElementById(
            'loading-text'
        ).innerText =
            "Buscando todos os seus anúncios na API do Mercado Livre...";


        document
            .getElementById('loading')
            .classList
            .remove('hidden');


        document
            .getElementById('loading')
            .classList
            .add('flex');


        document
            .getElementById('aviso-token')
            .classList
            .add('hidden');


        try {

            const {
                response,
                data
            } =
                await apiFetch(
                    '/api/anuncios'
                );


            if (
                response.status ===
                401
            ) {

                localStorage.removeItem(
                    'ml_access_token'
                );

                solicitarToken();

                alert(
                    data.erro ||
                    "O Access Token é inválido ou expirou."
                );

                return;
            }


            if (
                response.ok &&
                data.itens
            ) {

                cacheItens =
                    data.itens;


                atualizarCards(
                    cacheItens
                );


                executarBusca();


                alert(
                    `Sucesso! ${cacheItens.length} anúncios carregados.`
                );

            } else {

                alert(
                    data.erro ||
                    "Erro ao carregar anúncios."
                );
            }


        } catch (e) {

            console.error(e);


            alert(
                e.message ||
                "Erro de comunicação com o servidor no Render."
            );


        } finally {

            document
                .getElementById('loading')
                .classList
                .add('hidden');


            document
                .getElementById('loading')
                .classList
                .remove('flex');
        }
    }


    /* =========================================================
       SINCRONIZAR PREÇOS
    ========================================================= */

    async function sincronizarPrecosApi() {

        const token =
            obterTokenLocal();


        if (!token) {

            solicitarToken();

            return;
        }


        if (
            !cacheItens ||
            cacheItens.length === 0
        ) {

            alert(
                "Nenhum anúncio carregado na tela. Clique em 'Puxar Anúncios' primeiro."
            );

            return;
        }


        document.getElementById(
            'loading-text'
        ).innerText =
            "Puxando preços atuais das MLBs ativas...";


        document
            .getElementById('loading')
            .classList
            .remove('hidden');


        document
            .getElementById('loading')
            .classList
            .add('flex');


        try {

            const mlbs =
                cacheItens.map(
                    i => i.id
                );


            const {
                response,
                data
            } =
                await apiFetch(
                    '/api/sincronizar-precos',
                    {
                        method: 'POST',

                        body:
                            JSON.stringify({
                                ids: mlbs
                            })
                    }
                );


            if (
                response.status ===
                401
            ) {

                localStorage.removeItem(
                    'ml_access_token'
                );

                solicitarToken();

                alert(
                    data.erro ||
                    "Token inválido ou expirado."
                );

                return;
            }


            if (
                response.ok &&
                data.precos
            ) {

                cacheItens.forEach(
                    item => {

                        if (
                            data.precos[
                                item.id
                            ] !== undefined
                        ) {

                            item.price =
                                Number(
                                    data.precos[
                                        item.id
                                    ]
                                );


                            item.net_received =
                                item.price -
                                item.sale_fee -
                                (
                                    item.free_shipping
                                        ? item.shipping_cost
                                        : 0
                                );


                            if (
                                item.net_received < 0
                            ) {
                                item.net_received = 0;
                            }
                        }
                    }
                );


                atualizarCards(
                    cacheItens
                );


                executarBusca();


                alert(
                    "Preços reais sincronizados com sucesso para as MLBs existentes!"
                );

            } else {

                alert(
                    data.erro ||
                    "Erro ao sincronizar preços."
                );
            }


        } catch (e) {

            console.error(e);


            alert(
                e.message ||
                "Erro de comunicação com o servidor ao puxar preços."
            );


        } finally {

            document
                .getElementById('loading')
                .classList
                .add('hidden');


            document
                .getElementById('loading')
                .classList
                .remove('flex');
        }
    }


    /* =========================================================
       SINCRONIZAR FRETES

    async function sincronizarFretesApi() {

        const token =
            obterTokenLocal();


        if (!token) {

            solicitarToken();

            return;
        }


        if (
            !cacheItens ||
            cacheItens.length === 0
        ) {

            alert(

            'loading-text'

        document
            .getElementById('loading')
            .classList
            .add('flex');


        try {

            const mlbs =
                cacheItens.map(
                    i => i.id
                );


            const {
                response,
                data
            } =
                await apiFetch(
                    '/api/sincronizar-fretes',
                    {
                        method: 'POST',

                        body:
                            JSON.stringify({
                                ids: mlbs
                            })
                    }
                );


            if (
                response.status ===
                401
            ) {

                localStorage.removeItem(
                    'ml_access_token'
                );

                solicitarToken();

                alert(
                    data.erro ||
                    "Token inválido ou expirado."
                );

                return;
            }


            if (
                response.ok &&
                data.fretes
            ) {

                cacheItens.forEach(
                    item => {

                        if (

                                    ].custo

                                );


                            if (
                                item.net_received < 0

                            }

                    }

                atualizarCards(
                    cacheItens
                );


                executarBusca();


                alert(
                    "Fretes reais sincronizados com sucesso para as MLBs existentes!"
                );

            } else {

                alert(
                    data.erro ||
                    "Erro ao sincronizar fretes."
                );
            }


        } catch (e) {

            console.error(e);


            alert(
                e.message ||
                "Erro de comunicação com o servidor ao puxar fretes."
            );


        } finally {

            document
                .getElementById('loading')
                .classList
                .add('hidden');


            document
                .getElementById('loading')
                .classList
                .remove('flex');
        }
    }


    /* =========================================================
       ABAS
    ========================================================= */

    function mudarAba(aba) {

        abaAtualAtiva =
            aba;


        document
            .getElementById(
                'secao-gestao'
            )
            .classList
            .add('hidden');


        document
            .getElementById(
                'secao-simulacao'
            )
            .classList
            .add('hidden');


        document
            .getElementById(
                'secao-atualizacao'
            )

            'btn-gestao'

        document.getElementById(

            "nav-button px-3.5 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white";

            ).className =
                "nav-button active px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-2";


        } else if (
            aba ===
            'simulacao'
        ) {

            document
                .getElementById(
                    'secao-simulacao'
                )
                .classList
                .remove('hidden');


            document.getElementById(
                'btn-simulacao'
            ).className =
                "nav-button active px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-2";


        } else if (
            aba ===
            'atualizacao'
        ) {

            document
                .getElementById(
                    'secao-atualizacao'
                )
                .classList
                .remove('hidden');


            document.getElementById(
                'btn-atualizacao'
            ).className =
                "nav-button active px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-2";
        }


        executarBusca();
    }


    /* =========================================================
       CARDS
    ========================================================= */

    function atualizarCards(
        itens
    ) {

        const ativos =
            itens.filter(
                i =>
                    i.status ===
                    'active'
            ).length;


        document.getElementById(
            'total-listado'
        ).innerText =
            itens.length;


        document.getElementById(
            'total-ativos'
        ).innerText =
            ativos;


        document.getElementById(
            'total-outros'
        ).innerText =
            itens.length -
            ativos;
    }

                    );

                    );

                    </td>

                            Comissão:

                    </td>


                    <td class="p-4">

                        <span class="font-black text-emerald-400">
                            R$ ${liquido.toFixed(2)}

                    </td>


                    <td class="p-4">

                        <span class="text-slate-300">
                            ${Number(item.available_quantity || 0)}

                    <td class="p-4">

    /* =========================================================
       SIMULAÇÃO
    ========================================================= */

    function montarTabelaSimulacao(
        itens
    ) {

        const tbody =
            document.getElementById(
                'tabela-simulacao'
            );


        tbody.innerHTML = '';


        itens.forEach(
            item => {

                const index =
                    cacheItens.findIndex(
                        i =>
                            i.id ===
                            item.id
                    );


                const tipoNome =
                    item.listing_type_id ===
                    'gold_pro'
                        ? 'Premium'
                        : 'Clássico';


                const comissaoPadrao =
                    item.listing_type_id ===
                    'gold_pro'
                        ? 17
                        : 12;


                const tr =
                    document.createElement(
                        'tr'
                    );


                tr.className =
                    "hover:bg-slate-50 transition-colors";


                tr.innerHTML = `

                    <td class="p-3 font-mono font-medium text-slate-700 whitespace-nowrap">
                        ${escapeHtml(item.id || '')}
                    </td>


                    <td class="p-3 font-mono text-slate-600 whitespace-nowrap">
                        ${escapeHtml(item.sku || 'Sem SKU')}
                    </td>


                    <td

                        title="${escapeHtml(item.title || '')}"
                    >
                        ${escapeHtml(item.title || 'Sem título')}
                    </td>


                    <td class="p-3 font-bold text-slate-900 whitespace-nowrap">
                        R$ ${Number(item.price || 0).toFixed(2)}
                    </td>

                        R$ ${Number(item.shipping_cost || 0).toFixed(2)}
                    </td>


                    <td class="p-3">

                        <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${

                                : 'bg-blue-100 text-blue-800'
                        }">

                            ${tipoNome}

                        </span>

                    </td>


                    <td class="p-3 bg-yellow-50/60">

                        <input
                            type="number"

                            id="taxa_${index}"
                            value="${comissaoPadrao}"
                            oninput="recalcular(${index}, ${Number(item.shipping_cost || 0)}, ${!!item.free_shipping})"
                            class="input-simulacao w-16"
                        />

                    </td>


                    <td class="p-3 bg-yellow-50/60">

                        <input
                            type="number"
                            step="0.01"
                            id="custo_${index}"
                            value="10.00"
                            oninput="recalcular(${index}, ${Number(item.shipping_cost || 0)}, ${!!item.free_shipping})"
                            class="input-simulacao w-20"
                        />

                    </td>


                    <td class="p-3 bg-yellow-50/60">

                        <input
                            type="number"
                            step="0.1"
                            id="imposto_${index}"
                            value="0.0"
                            oninput="recalcular(${index}, ${Number(item.shipping_cost || 0)}, ${!!item.free_shipping})"
                            class="input-simulacao w-16"
                        />

                    </td>


                    <td class="p-3 bg-yellow-50/60">

                        <input
                            type="number"
                            step="0.1"
                            id="lucro_${index}"
                            value="12.0"
                            oninput="recalcular(${index}, ${Number(item.shipping_cost || 0)}, ${!!item.free_shipping})"
                            class="input-simulacao w-16"
                        />

                    </td>


                    <td
                        class="p-3 bg-emerald-50/70 font-black text-emerald-800 whitespace-nowrap"
                        id="novo_preco_${index}"
                    >
                        R$ 0.00
                    </td>


                    <td
                        class="p-3 bg-emerald-50/70 font-bold text-emerald-700 whitespace-nowrap"
                        id="lucro_sim_${index}"
                    >
                        R$ 0.00
                    </td>


                    <td
                        class="p-3 bg-emerald-50/70 font-bold text-emerald-900 whitespace-nowrap"
                        id="margem_real_${index}"
                    >
                        0.00%
                    </td>

                `;


                tbody.appendChild(
                    tr
                );


                recalcular(
                    index,
                    Number(
                        item.shipping_cost ||
                        0
                    ),
                    !!item.free_shipping
                );
            }
        );
    }


    function recalcular(
        index,
        custoFrete,
        freteGratis
    ) {

        const taxaEl =
            document.getElementById(
                `taxa_${index}`
            );


        const custoEl =
            document.getElementById(
                `custo_${index}`
            );


        const impostoEl =
            document.getElementById(
                `imposto_${index}`
            );


        const lucroEl =
            document.getElementById(
                `lucro_${index}`
            );


        if (
            !taxaEl ||
            !custoEl ||
            !impostoEl ||
            !lucroEl ||
            !cacheItens[index]
        ) {
            return;
        }


        const taxaPercent =
            parseFloat(
                taxaEl.value
            ) || 0;


        const custo =
            parseFloat(
                custoEl.value
            ) || 0;


        const impostoPercent =
            parseFloat(
                impostoEl.value
            ) || 0;


        const lucroDesejadoPercent =
            parseFloat(
                lucroEl.value
            ) || 0;


        const freteAplicado =
            freteGratis
                ? Number(custoFrete || 0)
                : 6.85;


        const somaPercentual =
            taxaPercent +
            impostoPercent +
            lucroDesejadoPercent;


        const divisor =
            1 -
            (
                somaPercentual /
                100
            );


        let novoPreco =
            divisor > 0
                ? (
                    custo +
                    freteAplicado
                ) / divisor
                : custo * 1.5;


        const valorTaxa =
            novoPreco *
            (
                taxaPercent /
                100
            );


        const valorImposto =
            novoPreco *
            (
                impostoPercent /
                100
            );


        const lucroLiquidoReal =
            novoPreco -
            custo -
            valorTaxa -
            valorImposto -
            freteAplicado;


        const margemRealPercent =
            novoPreco > 0
                ? (
                    lucroLiquidoReal /
                    novoPreco
                ) * 100
                : 0;


        const elNovoPreco =
            document.getElementById(
                `novo_preco_${index}`
            );


        const elLucroSim =
            document.getElementById(
                `lucro_sim_${index}`
            );


        const elMargemReal =
            document.getElementById(
                `margem_real_${index}`
            );


        if (elNovoPreco) {

            elNovoPreco.innerText =
                `R$ ${novoPreco.toFixed(2)}`;
        }


        if (elLucroSim) {

            elLucroSim.innerText =
                `R$ ${lucroLiquidoReal.toFixed(2)}`;
        }


        if (elMargemReal) {

            elMargemReal.innerText =
                `${margemRealPercent.toFixed(2)}%`;
        }


        novosPrecosCalculados[index] = {

            preco:
                novoPreco,

            foraDaMargem:
                Math.abs(
                    novoPreco -
                    Number(
                        cacheItens[index].price ||
                        0
                    )
                ) > 0.05
        };
    }


    /* =========================================================
       APLICAÇÃO EM MASSA
    ========================================================= */

    function aplicarEmMassa() {

        const custoMassa =
            document.getElementById(
                'massa-custo'
            ).value;


        const taxaMassa =
            document.getElementById(
                'massa-taxa'
            ).value;


        const impostoMassa =
            document.getElementById(
                'massa-imposto'
            ).value;


        const lucroMassa =
            document.getElementById(
                'massa-lucro'
            ).value;


        cacheItens.forEach(
            (
                item,
                index
            ) => {

                if (
                    custoMassa !== ''
                ) {

                    const el =
                        document.getElementById(
                            `custo_${index}`
                        );

                    if (el) {
                        el.value =
                            custoMassa;
                    }
                }


                if (
                    taxaMassa !== ''
                ) {

                    const el =
                        document.getElementById(
                            `taxa_${index}`
                        );

                    if (el) {
                        el.value =
                            taxaMassa;
                    }
                }


                if (
                    impostoMassa !== ''
                ) {

                    const el =
                        document.getElementById(
                            `imposto_${index}`
                        );

                    if (el) {
                        el.value =
                            impostoMassa;
                    }
                }


                if (
                    lucroMassa !== ''
                ) {

                    const el =
                        document.getElementById(
                            `lucro_${index}`
                        );

                    if (el) {
                        el.value =
                            lucroMassa;
                    }
                }


                recalcular(
                    index,
                    Number(
                        item.shipping_cost ||
                        0
                    ),
                    !!item.free_shipping
                );
            }
        );
    }


    /* =========================================================
       TABELA DE ATUALIZAÇÃO
    ========================================================= */

    function montarTabelaAtualizacao(
        itens
    ) {

        const tbody =
            document.getElementById(
                'tabela-atualizacao'
            );


        tbody.innerHTML = '';


        let contadorForaDaMargem =
            0;


        itens.forEach(
            item => {

                const index =
                    cacheItens.findIndex(
                        i =>
                            i.id ===
                            item.id
                    );


                const dadosSim =
                    novosPrecosCalculados[
                        index
                    ] || {

                        preco:
                            item.price,

                        foraDaMargem:
                            true
                    };


                if (
                    !dadosSim.foraDaMargem
                ) {
                    return;
                }


                contadorForaDaMargem++;


                const novoPreco =
                    Number(
                        dadosSim.preco ||
                        item.price ||
                        0
                    );


                const tr =
                    document.createElement(
                        'tr'
                    );


                tr.id =
                    `linha_atualizacao_${index}`;


                tr.className =
                    "hover:bg-slate-800/50 transition-colors";


                tr.innerHTML = `

                    <td class="p-4">

                        <input
                            type="checkbox"
                            value="${index}"
                            checked
                            class="check-item accent-yellow-400 w-4 h-4"
                        />

                    </td>


                    <td class="p-4">

                        <div class="flex items-center gap-3 min-w-[280px]">

                            <img
                                src="${item.thumbnail || ''}"
                                class="w-11 h-11 object-cover rounded-xl border border-slate-700 bg-slate-800"
                            />


                            <div class="min-w-0">

                                <span class="font-semibold text-white block line-clamp-1">
                                    ${escapeHtml(item.title || 'Sem título')}
                                </span>


                                <span class="text-[10px] text-slate-500 mt-1 block">

                                    ${escapeHtml(item.id || '')}

                                    <span class="text-slate-700 mx-1">
                                        •
                                    </span>

                                    SKU:
                                    ${escapeHtml(item.sku || 'Sem SKU')}

                                </span>

                            </div>

                        </div>

                    </td>


                    <td class="p-4 font-bold text-white whitespace-nowrap">

                        R$ ${Number(
                            item.price || 0
                        ).toFixed(2)}

                    </td>


                    <td class="p-4 whitespace-nowrap">

                        <span class="font-black text-emerald-400">

                            R$ ${novoPreco.toFixed(2)}

                        </span>

                    </td>


                    <td class="p-4">

                        <span class="inline-flex items-center gap-2 px-2.5 py-1 rounded-lg bg-amber-400/10 border border-amber-400/10 text-amber-400 font-bold text-[10px]">

                            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>

                            Fora da margem

                        </span>

                    </td>


                    <td
                        class="p-4"
                        id="status_api_${index}"
                    >

                        <span class="text-slate-500 text-[10px]">
                            Pendente
                        </span>

                    </td>

                `;


                tbody.appendChild(
                    tr
                );
            }
        );


        document.getElementById(
            'contador-atualizacao'
        ).innerText =
            contadorForaDaMargem;
    }


    /* =========================================================
       SELEÇÃO
    ========================================================= */

    function alternarTodos(
        master
    ) {

        const checkboxes =
            document.querySelectorAll(
                '.check-item'
            );


        checkboxes.forEach(
            cb => {
                cb.checked =
                    master.checked;
            }
        );
    }


    /* =========================================================
       ATUALIZAÇÃO EM MASSA
    ========================================================= */

    async function atualizarPrecosMassaApi() {

        const token =
            obterTokenLocal();


        if (!token) {

            solicitarToken();

            return;
        }


        const checkboxes =
            document.querySelectorAll(
                '.check-item:checked'
            );


        if (
            checkboxes.length === 0
        ) {

            alert(
                "Nenhum anúncio selecionado para atualização."
            );

            return;
        }


        if (
            !confirm(
                `Deseja atualizar ${checkboxes.length} anúncio(s) em lotes simultâneos de 20?`
            )
        ) {
            return;
        }


        let itensParaAtualizar =
            [];


        checkboxes.forEach(
            cb => {

                const index =
                    Number(
                        cb.value
                    );


                const item =
                    cacheItens[index];


                if (!item) {
                    return;
                }


                const dadosSim =
                    novosPrecosCalculados[
                        index
                    ];


                const novoPreco =
                    dadosSim
                        ? dadosSim.preco
                        : item.price;


                itensParaAtualizar.push({

                    index:
                        index,

                    id:
                        item.id,

                    price:
                        parseFloat(
                            Number(
                                novoPreco
                            ).toFixed(2)
                        )
                });
            }
        );


        const tamanhoLote =
            20;


        for (
            let i = 0;
            i < itensParaAtualizar.length;
            i += tamanhoLote
        ) {

            const lote =
                itensParaAtualizar.slice(
                    i,
                    i + tamanhoLote
                );


            lote.forEach(
                item => {

                    const elStatus =
                        document.getElementById(
                            `status_api_${item.index}`
                        );


                    if (elStatus) {

                        elStatus.innerHTML = `

                            <span class="inline-flex items-center gap-2 text-blue-400 animate-pulse font-bold text-[10px]">

                                <span class="w-1.5 h-1.5 bg-blue-400 rounded-full"></span>

                                Atualizando...

                            </span>

                        `;
                    }
                }
            );


            try {

                const {
                    response,
                    data
                } =
                    await apiFetch(
                        '/api/atualizar-precos',
                        {
                            method: 'POST',

                            body:
                                JSON.stringify({
                                    itens:
                                        lote.map(
                                            i => ({
                                                id:
                                                    i.id,

                                                price:
                                                    i.price
                                            })
                                        )
                                })
                        }
                    );


                if (
                    response.status ===
                    401
                ) {

                    localStorage.removeItem(
                        'ml_access_token'
                    );

                    solicitarToken();

                    alert(
                        data.erro ||
                        "Token inválido ou expirado."
                    );

                    return;
                }


                lote.forEach(
                    item => {

                        const elStatus =
                            document.getElementById(
                                `status_api_${item.index}`
                            );


                        const resultado =
                            Array.isArray(
                                data.resultados
                            )
                                ? data.resultados.find(
                                    r =>
                                        String(r.id) ===
                                        String(item.id)
                                )
                                : null;


                        if (
                            response.ok &&
                            resultado &&
                            resultado.sucesso
                        ) {

                            if (elStatus) {

                                elStatus.innerHTML = `

                                    <span class="inline-flex items-center gap-2 text-emerald-400 font-bold text-[10px]">

                                        <span class="w-5 h-5 rounded-full bg-emerald-400/10 flex items-center justify-center">
                                            ✓
                                        </span>

                                        Atualizado

                                    </span>

                                `;
                            }


                            cacheItens[
                                item.index
                            ].price =
                                item.price;


                            const cacheItem =
                                cacheItens[
                                    item.index
                                ];


                            cacheItem.net_received =
                                Math.max(
                                    0,
                                    Number(
                                        cacheItem.price
                                    ) -
                                    Number(
                                        cacheItem.sale_fee || 0
                                    ) -
                                    (
                                        cacheItem.free_shipping
                                            ? Number(
                                                cacheItem.shipping_cost || 0
                                            )
                                            : 0
                                    )
                                );


                        } else {

                            const erroMsg =
                                (
                                    resultado &&
                                    resultado.erro
                                ) ||
                                data.erro ||
                                "Falha na API";


                            if (elStatus) {

                                elStatus.innerHTML = `

                                    <span
                                        class="text-red-400 font-bold text-[10px]"
                                        title="${escapeHtml(erroMsg)}"
                                    >
                                        ✗ ${escapeHtml(erroMsg)}
                                    </span>

                                `;
                            }
                        }
                    }
                );


            } catch (e) {

                console.error(e);


                lote.forEach(
                    item => {

                        const elStatus =
                            document.getElementById(
                                `status_api_${item.index}`
                            );


                        if (elStatus) {

                            elStatus.innerHTML = `

                                <span class="text-red-400 font-bold text-[10px]">
                                    Erro de rede
                                </span>

                            `;
                        }
                    }
                );
            }


            if (
                i +
                tamanhoLote <
                itensParaAtualizar.length
            ) {

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            1000
                        )
                );
            }
        }


        alert(
            "Processo de envio em massa finalizado!"
        );


        atualizarCards(
            cacheItens
        );


        executarBusca();
    }


    /* =========================================================
       SEGURANÇA BÁSICA DO HTML
    ========================================================= */

    function escapeHtml(
        valor
    ) {

        return String(
            valor ?? ''
        )
            .replace(
                /&/g,
                '&amp;'
            )
            .replace(
                /</g,
                '&lt;'
            )
            .replace(
                />/g,
                '&gt;'
            )
            .replace(
                /"/g,
                '&quot;'
            )
            .replace(
                /'/g,
                '&#039;'
            );
    }


    /* =========================================================
       INICIALIZAÇÃO
    ========================================================= */

    window.addEventListener(
        'load',
        () => {

            const token =
                obterTokenLocal();


            if (token) {

                carregarDados();

            } else {

                solicitarToken();
            }
        }
    );
</script>
